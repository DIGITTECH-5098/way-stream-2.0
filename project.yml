# XcodeGen alternative — if you prefer regenerating the project:
#   brew install xcodegen && xcodegen generate
name: WayLink
options:
  bundleIdPrefix: com.d3m0n
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  WayLink:
    type: application
    platform: iOS
    sources:
      - WayLink
    settings:
      base:
        INFOPLIST_FILE: WayLink/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.d3m0n.waylink
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
