name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && sw_vers

      # Optional real signing: add repo secrets P12_BASE64, P12_PASSWORD,
      # PROVISIONING_BASE64, TEAM_ID, PROFILE_NAME and the IPA is signed for
      # direct device install. Without secrets the IPA is unsigned (re-sign
      # with AltStore/Sideloadly/Scarlet or your own cert before installing).
      - name: Import signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_BASE64: ${{ secrets.PROVISIONING_BASE64 }}
        run: |
          if [ -n "${P12_BASE64}" ]; then
            echo "HAS_SIGNING=1" >> "$GITHUB_ENV"
            KEYCHAIN_PASS="$(openssl rand -base64 16)"
            echo "KC_PASS=${KEYCHAIN_PASS}" >> "$GITHUB_ENV"
            security create-keychain -p "${KEYCHAIN_PASS}" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "${KEYCHAIN_PASS}" build.keychain
            echo "${P12_BASE64}" | base64 --decode > cert.p12
            security import cert.p12 -k build.keychain -P "${P12_PASSWORD}" \
              -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "${KEYCHAIN_PASS}" build.keychain
            echo "${PROVISIONING_BASE64}" | base64 --decode > profile.mobileprovision
          else
            echo "HAS_SIGNING=0" >> "$GITHUB_ENV"
          fi

      - name: Build (unsigned)
        if: env.HAS_SIGNING != '1'
        run: |
          xcodebuild -project WayLink.xcodeproj -scheme WayLink \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Build (signed)
        if: env.HAS_SIGNING == '1'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          xcodebuild -project WayLink.xcodeproj -scheme WayLink \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/WayLink.app"
          test -d "$APP"
          if [ "${HAS_SIGNING}" = "1" ]; then
            cp profile.mobileprovision "$APP/embedded.mobileprovision"
            codesign --force --sign "Apple Distribution" --timestamp=none "$APP"
            OUT="WayLink-signed.ipa"
          else
            OUT="WayLink-unsigned.ipa"
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "${OUT}" Payload
          ls -la "${OUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: WayLink-ipa
          path: WayLink-*.ipa
          if-no-files-found: error
