# Codemagic CI — free macOS builds (500 min/mo, no credit card).
# Sign up at codemagic.io with GitHub, add this repo, start the
# "WayLink IPA" workflow manually, download the IPA from Artifacts.
workflows:
  waylink-ipa:
    name: WayLink IPA
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build and package IPA
        script: |
          set -euo pipefail
          xcodebuild -project WayLink.xcodeproj -scheme WayLink \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build
          APP="build/Build/Products/Release-iphoneos/WayLink.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr WayLink-unsigned.ipa Payload
          ls -la WayLink-unsigned.ipa
    artifacts:
      - WayLink-*.ipa
